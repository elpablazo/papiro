[package]
name = "papiro"
version = "0.4.0"
edition = "2024"
description = "Self-hosted document archive with OCR and instant full-text search, in a single binary. A lightweight Paperless-ngx alternative."
license = "MIT"
repository = "https://github.com/elpablazo/papiro"
readme = "README.md"
keywords = ["paperless", "ocr", "document-management", "self-hosted", "sqlite"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart", "macros"] }
base64 = "0.23.1"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
imap = { version = "2.4.1", default-features = false }
mailparse = "0.18.0"
regex = "1.13.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip"] }
ureq = { version = "3.5.1", features = ["json", "multipart"] }
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
webpki-roots = "1.0.12"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = "thin"
